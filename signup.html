<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Create your account · Dealgrade</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#161616">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="site.css">
</head>
<body data-page="auth">
<main class="auth">
  <div class="auth-brand">
    <img class="bg" src="assets/dubai-tower.jpg" alt="" width="927" height="1400">
    <a class="brand" href="index.html" aria-label="Dealgrade, home"><span class="wm"></span></a>
    <div>
      <h1>Know what a Dubai home is worth before you deal.</h1>
      <div class="auth-facts"><div><b class="num">1.28M</b><span>registered Dubai sales behind every estimate</span></div><div><b>A to F</b><span>a grade on every asking price</span></div><div><b>Direct</b><span>owners and buyers, no agent in between</span></div></div>
    </div>
  </div>
  <div class="auth-form">
    <div id="slot" style="width:min(100%,430px)"></div>
  </div>
</main>
<script src="site.js"></script>
<script src="auth.js"></script>
<script>
(function(){
  /* One short step: an email, then a code. The line says what the account opens, and the visitor goes back to it. */
  var S = DGS, next = new URLSearchParams(location.search).get('next') || '';
  var WHY = {
    result: 'to see your result',
    projects: 'to see every project and its grade',
    project: 'to see every layout and the market around it',
    distress: 'to see distress sales, each priced against Dealgrade\'s valuation',
    listing: 'to open this home and message its owner',
    sell: 'to list your home and talk to buyers directly',
    legal: 'to keep asking the legal guide'
  };
  var back = 'index.html';
  try { if(document.referrer && new URL(document.referrer).origin === location.origin && !/signup|login|forgot/.test(document.referrer)) back = document.referrer; } catch(e) {}
  S.$('#slot').innerHTML = S.door({
    title: 'Create your account',
    line: WHY[next] ? 'It takes an email and a code, ' + WHY[next] + '.' : 'It takes an email and a code. Then you save valuations, follow the market and talk to owners directly.',
    next: next || 'signup', go: back
  });
  S.watch(document);
})();
</script>
</body>
</html>
