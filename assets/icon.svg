<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Dealgrade">
  <!--
    The Dealgrade mark: the wordmark's own letter — Arial Bold "D", the app's
    typeface — in white on the brand's slate indigo (the `palette-indigo-deep` token).

    The path is the glyph's outline, not live text, so it looks the same
    wherever it is shown; the raster icons (favicon.ico, apple-icon.png,
    public/icon-*.png) are drawn from the same glyph at the same proportions.

    Colours are literals, not currentColor: a favicon renders outside the
    document, where no stylesheet and no cascade have reached it.
  -->
